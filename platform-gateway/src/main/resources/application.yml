server:
  port: 8080

spring:
  application:
    name: platform-gateway

patrol:
  routes:
    # 巡查线服务地址（本地默认；K8s 中由环境变量覆盖为集群内 Service DNS）
    endpoints:
      content: http://localhost:8081
      message: http://localhost:8082
      account: http://localhost:8083
      fund: http://localhost:8084

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
