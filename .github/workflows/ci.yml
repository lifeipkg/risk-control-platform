name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & Test
        run: mvn -B verify

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - platform-gateway
          - content-patrol-service
          - message-patrol-service
          - account-patrol-service
          - fund-patrol-service
    steps:
      - uses: actions/checkout@v4
      - name: Build image (matrix, build context = repo root)
        run: |
          docker build \
            -f ${{ matrix.module }}/Dockerfile \
            -t registry.example.com/risk/${{ matrix.module }}:${{ github.sha }} .
